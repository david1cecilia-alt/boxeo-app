# Tests (Python + equivalencia con el motor JS) en cada push de cualquier rama y en cada PR; el
# despliegue de la PWA en GitHub Pages, solo desde main y solo si pasan.
name: Tests y despliegue

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium-headless-shell
      - name: Tests
        run: python -m pytest -q

  desplegar:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Un solo despliegue a la vez; si llega otro push, el que está en marcha termina.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar Playwright (pinta las fotos del maniquí sin WebGL)
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium-headless-shell
      - name: Montar la web (static/ + data/ + fotos del maniquí)
        run: python herramientas/construir_sitio.py _site "${{ github.sha }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
